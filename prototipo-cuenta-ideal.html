<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#1B1E24">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="Prototipo académico de una app bancaria. Proyecto escolar sin relación con ninguna institución financiera. No captura ni transmite datos.">
<title>Prototipo académico · Ideación y Prototipado</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --red:#EC1C2D; --red-700:#C41525; --red-600:#D71A2A; --red-50:#FDEEF0; --red-100:#FBDDE1;
  --ink:#16181D; --ink-2:#5B6472; --ink-3:#8A93A2; --line:#E4E7EC; --line-2:#F0F2F5;
  --bg:#F4F5F7; --card:#FFFFFF;
  --ok:#12A150; --ok-50:#E8F7EF; --err:#D92D20; --err-50:#FEECEA; --warn:#B54708; --warn-50:#FEF4E6;
  --r-s:10px; --r-m:14px; --r-l:20px; --r-xl:26px;
  --sh-1:0 1px 2px rgba(16,24,40,.05);
  --sh-2:0 2px 8px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --sh-3:0 8px 28px rgba(16,24,40,.10);
  --ff:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --dur:.26s;
}
@media (prefers-reduced-motion: reduce){ :root{ --dur:.001s } *{animation-duration:.001s!important;transition-duration:.001s!important} }

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--ff); background:#E9EBEF; color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-size:16.5px; line-height:1.45;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2.5px solid var(--red);outline-offset:2px;border-radius:6px}

/* ============ SHELL ============ */
.stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:0}
.device{
  width:100%;max-width:460px;background:var(--bg);position:relative;
  display:flex;flex-direction:column;min-height:100dvh;overflow:hidden;
}
.statusbar{display:none}
@media(min-width:860px){
  .stage{padding:22px;background:
    radial-gradient(900px 500px at 12% -10%, #FDE6E9 0%, transparent 60%),
    radial-gradient(700px 400px at 100% 110%, #E4E8F0 0%, transparent 60%), #EDEFF3;}
  .device{
    height:min(900px,calc(100dvh - 44px));min-height:640px;border-radius:40px;
    box-shadow:0 40px 80px -20px rgba(16,24,40,.35),0 0 0 10px #1B1D22,0 0 0 11px #34373E;
  }
  .statusbar{
    display:flex;align-items:center;justify-content:space-between;flex:none;
    padding:12px 26px 4px;font-size:13px;font-weight:650;letter-spacing:-.01em;
    background:transparent;position:relative;z-index:5;
  }
  .statusbar .sb-r{display:flex;gap:5px;align-items:center;opacity:.9}
  .statusbar.on-red{color:#fff;background:var(--red)}
}
#app{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;position:relative}
#app::-webkit-scrollbar{width:0}

.screen{display:flex;flex-direction:column;min-height:100%;animation:in var(--dur) cubic-bezier(.22,1,.36,1)}
@keyframes in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.pad{padding:20px 20px 24px}
.grow{flex:1}
.foot{padding:14px 20px calc(18px + env(safe-area-inset-bottom));background:var(--bg);position:sticky;bottom:0}
.foot.on-white{background:#fff;border-top:1px solid var(--line-2)}

/* ============ TYPE ============ */
h1,h2,h3,h4{margin:0;letter-spacing:-.032em;line-height:1.14;font-weight:800}
h1{font-size:33px} h2{font-size:26px} h3{font-size:20.5px;letter-spacing:-.022em} h4{font-size:17px;letter-spacing:-.015em;font-weight:700}
p{margin:0}
.lead{color:var(--ink-2);font-size:17px;line-height:1.5}
.muted{color:var(--ink-3);font-size:14.5px;line-height:1.45}
.sm{font-size:15px;color:var(--ink-2)}
.eyebrow{font-size:12.5px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.stack>*+*{margin-top:var(--g,12px)}

/* ============ BUTTONS ============ */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:16px 18px;border-radius:var(--r-m);font-weight:700;font-size:17px;
  letter-spacing:-.012em;transition:transform .12s,background var(--dur),opacity var(--dur);
  min-height:56px;
}
.btn:active{transform:scale(.978)}
.btn-p{background:var(--red);color:#fff;box-shadow:0 3px 10px rgba(236,28,45,.26)}
.btn-p:hover{background:var(--red-700)}
.btn-s{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn-s:hover{background:var(--line-2)}
.btn-g{background:transparent;color:var(--red);font-weight:700}
.btn-g:hover{background:var(--red-50)}
.btn[disabled]{opacity:.42;pointer-events:none;box-shadow:none}
.btn-sm{padding:11px 14px;min-height:46px;font-size:15.5px;width:auto;border-radius:11px}
.btn-row{display:flex;gap:10px}
.link{color:var(--red);font-weight:700;font-size:15.5px;text-decoration:none}
.link:hover{text-decoration:underline}

/* ============ CARDS ============ */
.card{background:var(--card);border-radius:var(--r-l);padding:18px;box-shadow:var(--sh-2)}
.card-flat{background:var(--card);border-radius:var(--r-m);padding:14px;border:1px solid var(--line-2)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* ============ TOPBAR ============ */
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px;flex:none}
.topbar .ttl{font-weight:750;font-size:17.5px;letter-spacing:-.02em;flex:1;text-align:center}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;transition:background var(--dur)}
.iconbtn:hover{background:rgba(0,0,0,.055)}
.iconbtn.on-red:hover{background:rgba(255,255,255,.16)}

/* ============ PROGRESS ============ */
.pbar{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .42s cubic-bezier(.22,1,.36,1)}

/* ============ OPTION CARDS ============ */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:15px 15px;border-radius:var(--r-m);background:#fff;border:1.6px solid var(--line);
  transition:border-color .16s,background .16s,transform .12s;
}
.opt:hover{border-color:#C9CFD8}
.opt:active{transform:scale(.99)}
.opt .oi{width:38px;height:38px;border-radius:11px;background:var(--line-2);display:grid;place-items:center;flex:none;transition:background .16s}
.opt .ol{font-weight:650;font-size:16.5px;letter-spacing:-.015em;flex:1}
.opt .od{display:block;font-size:14px;color:var(--ink-3);margin-top:3px;font-weight:450;letter-spacing:0;line-height:1.35}
.opt .ock{width:22px;height:22px;border-radius:50%;border:1.8px solid var(--line);flex:none;display:grid;place-items:center;transition:.16s}
.opt[aria-checked="true"]{border-color:var(--red);background:var(--red-50)}
.opt[aria-checked="true"] .oi{background:#fff}
.opt[aria-checked="true"] .ock{background:var(--red);border-color:var(--red)}
.opt[aria-checked="true"] .ock svg{opacity:1;transform:scale(1)}
.opt .ock svg{opacity:0;transform:scale(.5);transition:.16s}

/* ============ MASCOTA ============ */
.masc{display:block;pointer-events:none;user-select:none}
.masc-pop{animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.86)}to{opacity:1;transform:none}}
.tip{
  display:flex;gap:11px;align-items:flex-end;margin-bottom:14px;animation:pop .5s cubic-bezier(.34,1.56,.64,1);
}
.tip img{height:76px;flex:none;margin-bottom:-2px}
.tip .bub{
  background:#fff;border:1.5px solid var(--line);border-radius:16px 16px 16px 4px;
  padding:12px 15px;font-size:15px;color:var(--ink-2);line-height:1.4;box-shadow:var(--sh-1);flex:1;
}
.tip .bub b{color:var(--ink);font-weight:700}

/* ============ COMPATIBILIDAD ============ */
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--red);transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1)}
.ring .val{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .val b{font-size:26px;font-weight:800;letter-spacing:-.04em;display:block;line-height:1}
.ring .val span{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.minibar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;flex:1}
.minibar>i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .9s cubic-bezier(.22,1,.36,1)}

/* ============ TARJETA DE PRODUCTO ============ */
.prod{
  border-radius:var(--r-l);padding:18px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--red) 0%,var(--red-700) 100%);
}
.prod::after{
  content:'';position:absolute;right:-34px;top:-34px;width:150px;height:150px;border-radius:50%;
  background:rgba(255,255,255,.09);
}
.prod .pn{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.15;position:relative}
.prod .pt{font-size:14.5px;opacity:.9;margin-top:5px;position:relative;line-height:1.4}
.prod .pw{position:absolute;right:14px;bottom:12px;height:34px;opacity:.35}
.prod.dim{background:linear-gradient(135deg,#3E4653 0%,#232833 100%)}

/* ============ BADGES / CHIPS ============ */
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;font-size:13px;font-weight:700;letter-spacing:-.005em}
.b-red{background:var(--red-50);color:var(--red-700)} .b-ok{background:var(--ok-50);color:var(--ok)}
.b-gray{background:var(--line-2);color:var(--ink-2)} .b-warn{background:var(--warn-50);color:var(--warn)}
.b-err{background:var(--err-50);color:var(--err)}
.b-w{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(4px)}
.demo{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:5px;background:#EEF1F6;
  color:var(--ink-3);font-size:11px;font-weight:750;letter-spacing:.045em;text-transform:uppercase}

/* ============ STEPPER ============ */
.stepper{display:flex;align-items:flex-start;gap:0;padding:2px 0}
.stepper .st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.stepper .st::before,.stepper .st::after{content:'';position:absolute;top:13px;height:2.5px;background:var(--line);width:50%}
.stepper .st::before{left:0} .stepper .st::after{right:0}
.stepper .st:first-child::before,.stepper .st:last-child::after{display:none}
.stepper .st.done::before,.stepper .st.done::after,.stepper .st.now::before{background:var(--red)}
.stepper .dot{width:27px;height:27px;border-radius:50%;background:#fff;border:2.5px solid var(--line);
  display:grid;place-items:center;font-size:11.5px;font-weight:750;color:var(--ink-3);position:relative;z-index:2;transition:.3s}
.stepper .st.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.stepper .st.now .dot{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 0 4px var(--red-50)}
.stepper .sl{font-size:10.5px;font-weight:650;color:var(--ink-3);text-align:center;line-height:1.2;letter-spacing:-.005em;max-width:70px}
.stepper .st.now .sl{color:var(--red)}
.stepper .st.done .sl{color:var(--ink-2)}

/* ============ FORM ============ */
.field{display:block}
.field .fl{font-size:14px;font-weight:700;color:var(--ink-2);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.field input,.field select{
  width:100%;padding:13px 14px;border-radius:12px;border:1.6px solid var(--line);background:#fff;
  font-size:16.5px;font-weight:550;letter-spacing:-.01em;transition:border-color .16s;
}
.field input:focus{outline:none;border-color:var(--red)}
.field input:disabled{background:#F7F8FA;color:var(--ink-2);cursor:default}
.field .fh{font-size:13px;color:var(--ink-3);margin-top:5px}
.check{display:flex;gap:11px;align-items:flex-start;padding:13px;border-radius:12px;background:#fff;border:1.6px solid var(--line);cursor:pointer;text-align:left;width:100%}
.check[aria-checked="true"]{border-color:var(--red);background:var(--red-50)}
.check .cb{width:21px;height:21px;border-radius:6px;border:1.9px solid var(--line);flex:none;display:grid;place-items:center;margin-top:1px;transition:.16s}
.check[aria-checked="true"] .cb{background:var(--red);border-color:var(--red)}
.check .cb svg{opacity:0;transition:.16s} .check[aria-checked="true"] .cb svg{opacity:1}
.otp{display:flex;gap:9px;justify-content:center}
.otp input{width:56px;height:64px;text-align:center;font-size:26px;font-weight:800;border-radius:13px;border:1.8px solid var(--line);background:#fff;letter-spacing:0}
.otp input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3.5px var(--red-50)}

/* ============ CÁMARA / KYC ============ */
.cam{position:relative;border-radius:var(--r-l);overflow:hidden;background:#15171C;aspect-ratio:1.5/1;display:grid;place-items:center}
.cam.face{aspect-ratio:1/1.06}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam .frame{position:absolute;inset:13px;border:2.5px dashed rgba(255,255,255,.6);border-radius:14px;z-index:2;pointer-events:none}
.cam.face .frame{border-radius:50%;inset:26px 44px}
.cam .scan{position:absolute;left:13px;right:13px;height:2.5px;background:linear-gradient(90deg,transparent,var(--red),transparent);z-index:3;animation:scan 2.1s ease-in-out infinite;box-shadow:0 0 12px var(--red)}
@keyframes scan{0%,100%{top:16%}50%{top:84%}}
.cam .ph{position:relative;z-index:1;text-align:center;color:rgba(255,255,255,.55);padding:20px;font-size:12.5px;line-height:1.5}
.cam .ph svg{margin-bottom:8px;opacity:.6}
.cam .ok-ov,.cam .err-ov{position:absolute;inset:0;z-index:6;display:grid;place-content:center;justify-items:center;gap:10px;
  animation:in .3s;text-align:center;padding:20px;color:#fff;font-weight:750;font-size:15px}
.cam .ok-ov{background:rgba(18,161,80,.93)} .cam .err-ov{background:rgba(217,45,32,.93)}
.simbar{background:#1B1E24;border-radius:var(--r-m);padding:12px;margin-top:10px}
.simbar .sh{font-size:11.5px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:#7C8698;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.simbar .sr{display:flex;gap:8px}
.simbar button{flex:1;padding:12px 8px;border-radius:10px;font-size:14px;font-weight:700;transition:.15s;line-height:1.25}
.simbar .s-ok{background:rgba(18,161,80,.16);color:#4ADE80;border:1.4px solid rgba(18,161,80,.35)}
.simbar .s-ok:hover{background:rgba(18,161,80,.28)}
.simbar .s-no{background:rgba(217,45,32,.16);color:#FF8A80;border:1.4px solid rgba(217,45,32,.35)}
.simbar .s-no:hover{background:rgba(217,45,32,.28)}
.kyclist{display:flex;flex-direction:column;gap:8px}
.kycrow{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:12px;background:#fff;border:1.5px solid var(--line-2)}
.kycrow.now{border-color:var(--red);background:var(--red-50)}
.kycrow.ok{border-color:rgba(18,161,80,.3);background:var(--ok-50)}
.kycrow.no{border-color:rgba(217,45,32,.3);background:var(--err-50)}
.kycrow .kt{font-size:15px;font-weight:650;flex:1;letter-spacing:-.01em}
.kycrow .kd{display:block;font-size:13px;color:var(--ink-3);font-weight:450;margin-top:2px;line-height:1.3}

/* ============ SPINNER / SKELETON ============ */
.spin{width:22px;height:22px;border:2.5px solid rgba(255,255,255,.32);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.spin.dark{border-color:var(--line);border-top-color:var(--red)}
@keyframes sp{to{transform:rotate(360deg)}}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--red);animation:bl 1.3s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.18s} .dots i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

/* ============ HOME ============ */
.hero{background:linear-gradient(160deg,var(--red) 0%,var(--red-700) 100%);color:#fff;padding:14px 20px 58px;position:relative}
.hero .hl{font-size:14px;opacity:.85;font-weight:550}
.hero .hn{font-size:20.5px;font-weight:800;letter-spacing:-.03em}
.hero .hb{font-size:36px;font-weight:800;letter-spacing:-.045em;line-height:1.05;margin-top:2px}
.pull{margin-top:-44px;position:relative;z-index:2}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 3px;border-radius:15px;background:#fff;
  box-shadow:var(--sh-2);transition:transform .13s}
.qa button:active{transform:scale(.95)}
.qa .qi{width:38px;height:38px;border-radius:12px;background:var(--red-50);display:grid;place-items:center}
.qa .ql{font-size:12px;font-weight:650;color:var(--ink-2);letter-spacing:-.01em}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.li:last-child{border-bottom:0}
.li .lav{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--line-2)}
.li .lt{display:block;font-size:15.5px;font-weight:650;letter-spacing:-.012em}
.li .ld{display:block;font-size:13px;color:var(--ink-3);margin-top:2px;line-height:1.3}
.li .lv{font-size:15.5px;font-weight:750;letter-spacing:-.02em;margin-left:auto;white-space:nowrap}
.li .lv.neg{color:var(--ink)} .li .lv.pos{color:var(--ok)}
.goal .gt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}

/* ============ CHART ============ */
.chart{width:100%;height:132px;display:block}
.chart .gl{stroke:var(--line-2);stroke-width:1}
.chart .ln{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.chart .ar{opacity:.13}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);font-weight:600}
.lg i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.bars{display:flex;align-items:flex-end;gap:7px;height:104px}
.bars .bw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;height:100%}
.bars .bb{border-radius:5px 5px 2px 2px;background:var(--red);animation:gu .7s cubic-bezier(.22,1,.36,1) backwards}
@keyframes gu{from{height:0!important}}
.bars .bl{font-size:9.5px;color:var(--ink-3);text-align:center;font-weight:600}

/* ============ TABBAR ============ */
#tabbar{display:flex;background:#fff;border-top:1px solid var(--line);flex:none;
  padding:7px 4px calc(7px + env(safe-area-inset-bottom));position:relative;z-index:20}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;color:var(--ink-3);transition:color .16s}
#tabbar button .tl{font-size:11px;font-weight:650;letter-spacing:-.005em}
#tabbar button.on{color:var(--red)}
#tabbar .mid{flex:none;width:64px;position:relative}
#tabbar .mid .mb{position:absolute;top:-19px;left:50%;transform:translateX(-50%);width:52px;height:52px;border-radius:50%;
  background:linear-gradient(145deg,var(--red),var(--red-700));display:grid;place-items:center;
  box-shadow:0 6px 16px rgba(236,28,45,.42);border:3.5px solid #fff}
#tabbar .mid .tl{margin-top:35px}

/* ============ SHEET / MODAL ============ */
.ovl{position:absolute;inset:0;background:rgba(16,24,40,.45);z-index:60;display:flex;align-items:flex-end;
  animation:fade .2s;backdrop-filter:blur(2px)}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:8px 20px calc(22px + env(safe-area-inset-bottom));
  max-height:88%;overflow-y:auto;animation:up .32s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fadeOut{to{opacity:0}}
@keyframes popOut{to{opacity:0;transform:scale(.94)}}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 14px}
.ovl.center{align-items:center;justify-content:center;padding:24px}
.ovl.center .sheet{border-radius:22px;max-width:360px;animation:pop .3s cubic-bezier(.34,1.56,.64,1);padding:22px}

/* ============ TOAST ============ */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;
  align-items:center;pointer-events:none;width:min(400px,calc(100% - 32px))}
.toast{background:#1B1E24;color:#fff;padding:13px 17px;border-radius:13px;font-size:15px;font-weight:600;
  box-shadow:var(--sh-3);animation:tin .3s cubic-bezier(.22,1,.36,1);display:flex;gap:9px;align-items:center;width:100%}
@keyframes tin{from{opacity:0;transform:translateY(14px)}}
.toast.out{animation:tout .3s forwards} @keyframes tout{to{opacity:0;transform:translateY(10px)}}

/* ============ PUSH ============ */
.push{display:flex;gap:11px;padding:12px;background:rgba(255,255,255,.97);border-radius:17px;
  box-shadow:var(--sh-3);border:1px solid rgba(0,0,0,.05);backdrop-filter:blur(12px);animation:pd .55s cubic-bezier(.22,1,.36,1)}
@keyframes pd{from{opacity:0;transform:translateY(-24px)}}
.push img{width:34px;height:34px;border-radius:9px;flex:none}
.push .pt{font-size:12.5px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-3)}
.push .pm{font-size:15px;font-weight:600;line-height:1.35;margin-top:2px;letter-spacing:-.012em}

/* --- aire alrededor de las negritas dentro de texto corrido --- */
.note b,.note span b,.bub b,.push .pm b,.lead b,.muted b,.sm b,.kv span b,.opt .ol b{margin-right:.34em}
.note b:last-child,.bub b:last-child,.lead b:last-child{margin-right:0}

.tarjeta{position:relative;border-radius:18px;padding:16px;color:#fff;overflow:hidden;
  background:linear-gradient(135deg,var(--red) 0%,#A81020 100%);box-shadow:0 10px 26px rgba(236,28,45,.26);
  display:flex;flex-direction:column;justify-content:space-between;min-height:186px;transition:background .3s,box-shadow .3s}
.tarjeta::after{content:'';position:absolute;right:-52px;top:-52px;width:196px;height:196px;border-radius:50%;background:rgba(255,255,255,.09)}
.tarjeta.mini{min-height:0;padding:14px;border-radius:15px}
.tarjeta.frz{background:linear-gradient(135deg,#6B7480 0%,#333941 100%);box-shadow:0 10px 26px rgba(16,24,40,.22)}
.tarjeta>*{position:relative;z-index:1}
.chip{width:36px;height:27px;border-radius:6px;background:linear-gradient(135deg,#F6D492,#D3A04C)}
.chip::after{content:'';display:block;margin:8px auto 0;width:22px;height:1.5px;background:rgba(0,0,0,.22);
  box-shadow:0 5px 0 rgba(0,0,0,.22),0 -4px 0 rgba(0,0,0,.22)}
.tnum{font-size:19px;font-weight:700;letter-spacing:.13em;font-variant-numeric:tabular-nums;white-space:nowrap}
.tnum.mini{font-size:14px;letter-spacing:.1em}
.tmeta{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.72}
.frzchip{position:absolute;inset:0;z-index:2;display:grid;place-content:center;justify-items:center;gap:6px;
  background:rgba(20,24,30,.42);backdrop-filter:blur(1.5px);font-size:12.5px;font-weight:750}

/* ============ INTERRUPTOR ============ */
.sw{width:46px;height:27px;border-radius:99px;background:var(--line);position:relative;transition:background .22s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  box-shadow:var(--sh-1);transition:transform .22s}
.sw[aria-checked="true"]{background:var(--red)}
.sw[aria-checked="true"]::after{transform:translateX(19px)}

.salto{animation:salto .7s cubic-bezier(.34,1.56,.64,1) .25s backwards}
@keyframes salto{from{opacity:0;transform:scale(.5) translateY(8px)}}

.onda{width:4px;height:5px;border-radius:99px;background:var(--line);transition:height .07s linear,background .12s}
.onda.sim{animation:onda 1.1s ease-in-out infinite}
.onda.sim:nth-child(3n){animation-duration:.85s} .onda.sim:nth-child(3n+1){animation-duration:1.35s}
@keyframes onda{0%,100%{height:5px;background:var(--line)}50%{height:30px;background:var(--red)}}
.btn.off{opacity:.55;box-shadow:none;background:var(--line);color:var(--ink-3)}
.btn.off:hover{background:var(--line)}
.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}

/* ============ MADRIGUERA ============ */
.mad{display:block;width:100%;height:auto;pointer-events:none;user-select:none;
  transition:opacity .3s,filter .3s}
.mad.rota{filter:grayscale(.65) brightness(.88);opacity:.6}
.mad.sube{animation:madSube .62s cubic-bezier(.34,1.56,.64,1)}
@keyframes madSube{0%{transform:scale(.82) translateY(10px);opacity:.3}60%{transform:scale(1.05)}100%{transform:none;opacity:1}}
.mad.brilla{animation:madBrilla .8s ease-out}
@keyframes madBrilla{0%{filter:brightness(1)}35%{filter:brightness(1.35) saturate(1.15)}100%{filter:brightness(1)}}

/* chip de racha en el encabezado */
.chipmad{display:flex;align-items:center;gap:7px;padding:5px 11px 5px 6px;border-radius:99px;
  background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.22);
  transition:background .2s}
.chipmad:hover{background:rgba(255,255,255,.28)}
.chipmad img{width:30px;height:30px;object-fit:contain;object-position:bottom;flex:none}
.chipmad b{font-size:15.5px;font-weight:800;letter-spacing:-.03em;line-height:1}
.chipmad span{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.85;display:block;margin-top:1px}
.chipmad.urge{background:#FFD84D;border-color:#FFD84D;color:#5C4300}
.chipmad.urge span{opacity:.75}

/* ============ EXPLICADOR DE CASHBACK ============ */
.tasas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tasa{border-radius:16px;padding:14px 12px;text-align:center;border:1.6px solid var(--line);background:#fff}

.paso3{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:15px}
.paso3:last-child{padding-bottom:0}

.franja{flex:none;display:flex;align-items:center;justify-content:center;gap:7px;z-index:95;
  background:#1B1E24;color:#fff;padding:5px 12px;font-size:11px;font-weight:700;letter-spacing:.02em;
  text-align:center;line-height:1.3}

.mtr .mv{font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1}

.tabs{display:flex;gap:6px;background:var(--line-2);padding:4px;border-radius:12px}
.tabs button{flex:1;padding:9px;border-radius:9px;font-size:14.5px;font-weight:650;color:var(--ink-2);transition:.16s}

[hidden]{display:none!important}

/* Calcula puntaje y compatibilidad de cada cuenta */
function evaluar(a){
  const raw={}; IDS.forEach(id=>raw[id]=0); let max=0;
  for(const q in a){
    const tab=W[q]; if(!tab) continue;
    const vals=Array.isArray(a[q])?a[q]:[a[q]];
    vals.forEach(v=>{
      const r=tab[v]; if(!r) return;
      let mejor=0; IDS.forEach(id=>{ raw[id]+=(r[id]||0); mejor=Math.max(mejor,r[id]||0) });
      max+=mejor;
    });
  }
  const lista=IDS.map(id=>{
    let pct=max?Math.round(100*raw[id]/max):50;
    pct=Math.max(34,Math.min(97,pct));
    return {id,pct,raw:raw[id]};
  }).sort((x,y)=>y.raw-x.raw);
  // separa visualmente el primero para que la recomendación se lea clara
  if(lista.length>1&&lista[0].pct-lista[1].pct<4) lista[0].pct=Math.min(97,lista[1].pct+4);
  return lista;
}

function razones(id,a){
  const r=[], c=CUENTAS[id];
  if(a.canal==='app'&&id==='digital') r.push('Quieres hacer todo desde la app y esta se abre y se usa sin pisar sucursal');
  if(a.canal==='app'&&id!=='digital'&&c.ap!=='sucursal') r.push('Se puede manejar por completo desde Banorte Móvil');
  if(a.canal==='sucursal') r.push('Combina la app con atención presencial, como lo pediste');
  if(a.prioridad==='comisiones') r.push(id==='digital'||id==='facil'?'Sin comisión por manejo de cuenta':'Puedes exentar la membresía usando la cuenta con regularidad');
  if(a.prioridad==='control') r.push('Incluye herramientas para ver y clasificar tus gastos');
  if(a.prioridad==='rendimientos') r.push(['preferente','mujer','personal'].includes(id)?'Incluye Inversión Vista para que tu saldo genere rendimientos':'Puedes complementarla con un producto de inversión aparte');
  if(a.prioridad==='recompensas') r.push('Cashback de hasta 4% en la categoría que elijas');
  if(a.prioridad==='servicio') r.push('Da acceso a atención preferencial y coberturas');
  if(a.proposito==='nomina') r.push(id==='nomina'?'Está hecha para recibir tu sueldo':'Puedes recibir tu nómina en ella');
  if(a.proposito==='guardar'||a.ahorro) r.push(['mujer','preferente'].includes(id)?'Permite apartados y ahorro programado con rendimientos':'Puedes crear metas de ahorro dentro de la app');
  if(a.monto==='alto'&&id==='digital') r.push('Ojo: por ser de apertura digital tiene tope de depósitos mensual');
  if(a.monto==='bajo') r.push('Funciona bien con montos moderados y sin saldo mínimo');

  if(!r.length) r.push('Cubre lo que respondiste sin agregarte requisitos de más');
  return r.slice(0,4);
}

/* ---------- toasts / hojas ---------- */
function toast(msg,icon){
  const t=document.createElement('div'); t.className='toast';
  t.innerHTML=(icon?ic(icon,17,'#fff'):'')+`<span>${msg}</span>`;
  $('#toast').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300)},2600);
}
function sheet(html,center){
  cerrar(true);
  const o=document.createElement('div');
  o.className='ovl'+(center?' center':''); o.id='ovl';
  o.innerHTML=`<div class="sheet">${center?'':'<div class="grab"></div>'}${html}</div>`;
  o.addEventListener('click',e=>{ if(e.target===o) cerrar() });
  $('#device').appendChild(o);
}
function cerrar(inst){
  const o=$('#ovl'); if(!o) return;
  // La hoja saliente deja de existir para el código en el mismo instante:
  // si conserva id o data-a, las consultas golpean el nodo moribundo.
  o.id=''; o.style.pointerEvents='none';
  o.querySelectorAll('[data-a],[id],[data-ring],[data-bar]').forEach(el=>{
    el.removeAttribute('data-a'); el.removeAttribute('id');
    el.removeAttribute('data-ring'); el.removeAttribute('data-bar');
  });
  if(inst){ o.remove(); return }
  const h=o.querySelector('.sheet');
  o.style.animation='fadeOut .26s forwards';
  if(h) h.style.animation=o.classList.contains('center')?'popOut .2s forwards':'down .28s cubic-bezier(.4,0,1,1) forwards';
  setTimeout(()=>o.remove(),290);
}
ACT.cerrar=()=>cerrar();

function ring(pct){
  const C=2*Math.PI*44;
  return `<div class="ring"><svg width="104" height="104" viewBox="0 0 104 104">
    <circle class="bgc" cx="52" cy="52" r="44"/>
    <circle class="fgc" cx="52" cy="52" r="44" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-ring="${pct}"/>
  </svg><div class="val"><b class="num">${pct}%</b><span>Compat.</span></div></div>`;
}
function animRings(){
  $$('[data-ring]').forEach(c=>{
    const C=2*Math.PI*44, p=+c.dataset.ring;
    requestAnimationFrame(()=>{ c.style.strokeDashoffset=C-(C*p/100) });
  });
  $$('[data-bar]').forEach(b=>{ requestAnimationFrame(()=>{ b.style.width=b.dataset.bar+'%' }) });
}

ACT.rutaRapida=()=>{ S.rec=null; S.rapida=true; met(m=>m.rapida=(m.rapida||0)+1); go('comparar') };
ACT.volverCuestionario=()=>{ met(m=>m.rapidaVuelta=(m.rapidaVuelta||0)+1); S.rapida=false; ACT.empezar() };
ACT.empezar=()=>{
  S.quiz={i:0,resp:{},plan:BASE.slice(),t0:Date.now(),visto:BASE[0]};
  const n=BASE.length; const a=1+Math.floor(Math.random()*(n-1));
  let b=1+Math.floor(Math.random()*(n-1)); if(b===a) b=(a%(n-1))+1;
  S.quiz.tips=[a,b];
  met(m=>m.quizInic++);
  go('quiz');
};

ACT.falta=v=>{
  const [sel,msg]=String(v).split('|');
  const el=sel&&document.querySelector(sel);
  if(el){ el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),480);
    if(el.scrollIntoView) try{ el.scrollIntoView({block:'center',behavior:'smooth'}) }catch(_){} }
  toast(msg||'Falta un dato','info');
};
ACT.qResp=v=>{
  const q=S.quiz, id=q.plan[q.i], d=Q[id];
  if(d.multi){
    const cur=q.resp[id]||[];
    if(cur.includes(v)) q.resp[id]=cur.filter(x=>x!==v);
    else if(cur.length<d.multi) q.resp[id]=cur.concat(v);
    else { toast(`Puedes elegir hasta ${d.multi}`,'info'); return }
  } else {
    q.resp[id]=v;
    // la primera respuesta define qué preguntas extra aplican
    if(id==='proposito'){
      const antes=q.plan.length;
      q.plan=plan(q.resp);
      Object.keys(q.resp).forEach(k=>{ if(!q.plan.includes(k)) delete q.resp[k] });
      if(q.plan.length!==antes) setTimeout(()=>toast('Ajusté las preguntas a tu respuesta','spark'),760);
    }
  }
  guardar(); pinta();
};
ACT.qSig=()=>{
  const q=S.quiz;
  if(!q.resp[q.plan[q.i]]) return;
  if(q.i<q.plan.length-1){ q.i++; q.visto=q.plan[q.i]; guardar(); pinta() }
  else{
    const seg=Math.round((Date.now()-q.t0)/1000);
    met(m=>{ m.quizComp++; m.tiempos.push(seg); if(m.tiempos.length>200)m.tiempos.shift() });
    S.rec=evaluar(q.resp);
    met(m=>inc(m.recom,S.rec[0].id));
    go('analizando');
  }
};
ACT.qAtras=()=>{
  const q=S.quiz;
  if(q.i===0) return go('welcome');
  met(m=>inc(m.atras,q.plan[q.i]));
  q.i--; q.visto=q.plan[q.i]; guardar(); pinta();
};
ACT.salirQuiz=()=>sheet(`<h3>¿Salir del cuestionario?</h3>
  <p class="lead" style="margin-top:8px;font-size:14.5px">Tus respuestas quedan guardadas.</p>
  <div class="stack" style="--g:9px;margin-top:18px">
    <button class="btn btn-s" data-a="cerrar">Seguir contestando</button>
    <button class="btn btn-g" data-a="volverGate">Salir</button></div>`,true);

const PASOS_AN=['Leyendo tus respuestas','Comparando las 6 cuentas','Revisando comisiones y topes','Calculando compatibilidad'];
V.analizando=()=>{
  post(async()=>{
    for(let i=0;i<PASOS_AN.length;i++){
      await wait(360);
      const el=document.getElementById('an'+i); if(!el) return;
      el.querySelector('.ai').innerHTML=ic('check',15,'var(--ok)',3);
      el.style.opacity='1';
      const nx=document.getElementById('an'+(i+1)); if(nx) nx.style.opacity='.55';
    }
    await wait(420); if(S.pant==='analizando') go('resultado');

ACT.volverQuiz=()=>{ S.quiz.i=S.quiz.plan.length-1; go('quiz') };

  <p class="lead" style="margin-top:8px;font-size:14.5px">Se borran tus respuestas y empiezas de cero.</p>
  <div class="stack" style="--g:9px;margin-top:18px">

    <button class="btn btn-g" data-a="rehacerOk">Rehacer</button></div>`,true);

/* ============================================================
   5 · COMPARADOR
============================================================ */
V.comparar=()=>{
  post(animRings);
  const sinQuiz=!S.rec;
  if(!sinQuiz) met(m=>m.verOtras++);
  const lista=S.rec||IDS.map(id=>({id,pct:null}));
  return `<div class="screen">
    ${topbar(sinQuiz?'Elige tu cuenta':'Todas las opciones',sinQuiz?'volverBienvenida':'irResultado')}
    <div class="pad" style="padding-top:2px">
      <p class="muted">${sinQuiz
        ? 'Las seis cuentas, con lo que resuelve cada una.'
        : 'Ordenadas por qué tanto encajan. Tú decides.'}</p>
      <div class="stack" style="--g:11px;margin-top:16px">
        ${lista.map((r,i)=>{
          const c=CUENTAS[r.id], top=!sinQuiz&&i===0;
          return `<div class="card" style="padding:15px;${top?'border:1.6px solid var(--red)':''}">
            <div class="between" style="align-items:flex-start">
              <div style="flex:1">
                ${top?'<span class="badge b-red" style="margin-bottom:6px">Mejor opción para ti</span>':''}
                <h4>${c.n}</h4>
                <p class="muted" style="margin-top:3px">${c.tag}</p>
              </div>
              ${sinQuiz?'':`<div style="text-align:right;flex:none;margin-left:10px">
                <b class="num" style="font-size:21px;letter-spacing:-.04em;color:${top?'var(--red)':'var(--ink)'}">${r.pct}%</b>
                <div style="font-size:9px;font-weight:750;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em">Compat.</div>
              </div>`}
            </div>
            ${sinQuiz
              ? `<div class="row" style="gap:6px;flex-wrap:wrap;margin:11px 0 12px">
                  ${c.par.map(p=>`<span class="badge b-gray">${p}</span>`).join('')}</div>`
              : `<div class="minibar" style="margin:11px 0 12px"><i data-bar="${r.pct}" style="width:0;${top?'':'background:var(--ink-3)'}"></i></div>`}
            <div class="stack" style="--g:5px">
              ${c.bul.slice(0,2).map(b=>`<div class="row" style="gap:7px">${ic('check',13,'var(--ok)',3)}<span style="font-size:12.5px;color:var(--ink-2)">${b}</span></div>`).join('')}
            </div>
            <div class="between" style="margin-top:13px">
              <span class="badge ${c.ap==='linea'?'b-ok':'b-gray'}">${ic(c.apI,12)} ${c.apL}</span>
              <button class="btn ${top?'btn-p':'btn-s'} btn-sm" data-a="abrir" data-v="${r.id}">Elegir</button>
            </div>
          </div>`}).join('')}
      </div>
      ${sinQuiz?`<div class="card" style="margin-top:16px;text-align:center">
        <p class="sm" style="font-weight:650">¿No estás seguro?</p>
        <p class="muted" style="margin-top:4px">Contesta seis preguntas y te digo cuál encaja.</p>
        <button class="btn btn-s btn-sm" data-a="volverCuestionario" style="width:100%;margin-top:12px">Ayúdame a elegir</button>
      </div>`:''}
      <p class="muted" style="margin:16px 0 8px;text-align:center">Recomendación conceptual para este prototipo.</p>
    </div>
  </div>`;
};
ACT.irResultado=()=>go('resultado');
ACT.volverBienvenida=()=>{ S.rapida=false; go('welcome') };

/* Elegir cuenta: bifurca según cómo se abre hoy */
ACT.abrir=id=>{
  const c=CUENTAS[id];
  if(S.rec&&id!==S.rec[0].id) met(m=>m.cambio++);
  cerrar();
  S.elegida=id;
  S.reg={paso:1,sub:0,ine:null,ineb:null,live:null,otp:'',datos:{},terms:false,abierta:false,pausada:null,t0:Date.now()};
  go('registro');
};

  return `<div class="stepper">${PASOS.map((p,i)=>{

let stream=null, camOK=false;
async function camOn(mode){
  camOff();
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw 0;
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:mode,width:{ideal:720}},audio:false});
    const v=$('#cam'); if(v){ v.srcObject=stream; await v.play().catch(()=>{}) ; v.hidden=false }
    camOK=true; const c=$('#camState'); if(c) c.innerHTML=`<span class="badge b-ok">${ic('cam',12)} Cámara activa</span>`;
  }catch(e){
    camOK=false; const c=$('#camState');
    if(c) c.innerHTML=`<span class="badge b-gray">${ic('cam',12)} Vista simulada</span>`;
  }
}
function camOff(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null } micOff() }

/* --- micrófono para la verificación por voz --- */
let mic=null, micCtx=null, micRaf=0;
async function micOn(){
  micOff();
  const barras=()=>[...document.querySelectorAll('#nivel .onda')];
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw 0;
    mic=await navigator.mediaDevices.getUserMedia({audio:true});
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) throw 0;
    micCtx=new AC();
    const an=micCtx.createAnalyser(); an.fftSize=64;
    micCtx.createMediaStreamSource(mic).connect(an);
    const buf=new Uint8Array(an.frequencyBinCount);
    const st=$('#camState'), tx=$('#micTxt');
    if(st) st.innerHTML=`<span class="badge b-ok">${ic('phone',12)} Micrófono activo</span>`;
    if(tx) tx.textContent='Te estamos escuchando. Lee la frase completa.';
    const tic=()=>{
      const b=barras(); if(!b.length){ micRaf=0; return }
      an.getByteFrequencyData(buf);
      b.forEach((el,i)=>{
        const v=buf[Math.floor(i*buf.length/b.length)]/255;
        el.style.height=Math.max(4,Math.round(4+v*38))+'px';
        el.style.background=v>.32?'var(--red)':'var(--line)';
      });
      micRaf=requestAnimationFrame(tic);
    };
    tic();
  }catch(e){
    const st=$('#camState'), tx=$('#micTxt');
    if(st) st.innerHTML=`<span class="badge b-gray">${ic('phone',12)} Vista simulada</span>`;
    if(tx) tx.textContent='El navegador no dio acceso al micrófono. La demostración funciona igual.';
    barras().forEach(el=>el.classList.add('sim'));
  }
}
function micOff(){
  if(micRaf) cancelAnimationFrame(micRaf); micRaf=0;
  if(mic){ mic.getTracks().forEach(t=>t.stop()); mic=null }
  if(micCtx){ try{micCtx.close()}catch(e){} micCtx=null }
}

/* ---- Paso 4 ---- */
function regDomicilio(){
  return `<div class="pad grow">
    <p class="lead" style="font-size:14.5px">Aquí llega tu tarjeta física, si la pides.</p>
    <div class="stack" style="--g:13px;margin-top:18px">
      <label class="field"><span class="fl">Código postal ${dmo()}</span><input value="${DEMO.cp}" disabled></label>
      <div class="row" style="gap:11px;align-items:flex-end">
        <label class="field" style="flex:2"><span class="fl">Calle ${dmo()}</span><input value="${DEMO.calle}" disabled></label>
        <label class="field" style="flex:1"><span class="fl">Número</span><input value="${DEMO.num}" disabled></label>
      </div>
      <label class="field"><span class="fl">Colonia ${dmo()}</span><input value="${DEMO.col}" disabled></label>
      <label class="field"><span class="fl">Ciudad y estado ${dmo()}</span><input value="${DEMO.ciudad}, ${DEMO.estado}" disabled></label>
    </div>
    ${autosave()}
  </div>
  <div class="foot on-white"><button class="btn btn-p" data-a="regSig">Continuar</button></div>`;
}

/* ---- Paso 5 ---- */
function regConfirma(){
  const c=CUENTAS[S.elegida];
  return `<div class="pad grow">
    <p class="lead" style="font-size:14.5px">Revisa y confirma. Es el último paso.</p>

        <span class="eyebrow">Antes de continuar</span></div>
      <button class="check" role="checkbox" aria-checked="${S.reg.terms}" data-a="terms" style="border-color:var(--red);padding:15px">

ACT.verTerminos=()=>sheet(`<h3>Términos y condiciones</h3>
  <p class="muted" style="margin-top:6px">Prototipo académico. No genera ninguna relación contractual con Banorte ni con ninguna institución financiera. Los datos son ficticios y no se envían a ningún servidor.</p>
  <div class="divider"></div>
  <h4>Programa de cashback</h4>
  <div class="stack" style="--g:11px;margin-top:11px">
    <div><b style="font-size:13.5px">1. Qué genera cashback</b>
      <p class="muted" style="margin-top:3px">El cashback se genera al pagar con tu tarjeta de débito en las categorías participantes: gasolina, farmacias, transporte y movilidad, suscripciones digitales, tiendas departamentales, cine y entretenimiento, y supermercado. Los depósitos no generan cashback.</p></div>
    <div><b style="font-size:13.5px">2. Tasa base</b>
      <p class="muted" style="margin-top:3px">2% sobre tus compras en las categorías participantes.</p></div>
    <div><b style="font-size:13.5px">3. Tasa preferente</b>
      <p class="muted" style="margin-top:3px">Solo en comercios adheridos de la categoría que elijas. Supermercado paga 3%.</p></div>
    <div><b style="font-size:13.5px">4. Beneficio por fondeo el mismo día</b>
      <p class="muted" style="margin-top:3px">Si fondeas tu cuenta el mismo día en que la abres, durante 30 días naturales todas las categorías participantes pagan la tasa preferente. Al terminar ese periodo eliges una categoría para conservarla, o dos si tienes cuatro quincenas de racha.</p></div>
    <div><b style="font-size:13.5px">5. Tope mensual</b>
      <p class="muted" style="margin-top:3px">${mx0(300)} de cashback por mes natural, que sube a ${mx0(450)} con ocho quincenas de racha. Lo que exceda el tope no genera cashback hasta el mes siguiente.</p></div>
    <div><b style="font-size:13.5px">6. Cambio de categoría</b>
      <p class="muted" style="margin-top:3px">Puedes cambiar tu selección una vez cada dos meses, o cada mes con doce quincenas de racha.</p></div>
    <div><b style="font-size:13.5px">7. Ejemplo</b>
      <p class="muted" style="margin-top:3px">Gastas ${mx0(2500)} en una gasolinera adherida y recibes ${mx0(100)}. En cualquier otra, ${mx0(50)}.</p></div>
    <div><b style="font-size:13.5px">8. Racha</b>
      <p class="muted" style="margin-top:3px">Una quincena cuenta si tu cuenta recibe al menos ${mx0(300)} acumulados, sin importar el origen. Ganas un pase por cada tres quincenas cumplidas.</p></div>
  </div>
  <button class="btn btn-p" data-a="aceptarTerminos" style="margin-top:18px">Aceptar y continuar</button>
  <button class="btn btn-g" data-a="cerrar" style="margin-top:6px">Cerrar</button>`);
ACT.aceptarTerminos=()=>{ S.reg.terms=true; guardar(); cerrar(); pinta() };
ACT.terms=()=>{ S.reg.terms=!S.reg.terms; guardar(); pinta() };

/* ---- Navegación del registro ---- */
ACT.regSig=()=>{
  const r=S.reg;
  if(r.paso<5){ r.paso++; r.sub=0; camOff(); guardar(); pinta(); $('#app').scrollTop=0; toast('Avance guardado','cloud') }
};
ACT.pausar=()=>{ cerrar(); camOff(); S.reg.pausada=Date.now(); S.reg.volviendo=false; guardar(); go('pausa') };
ACT.finalizar=async(v,el)=>{
  el.innerHTML='<span class="spin"></span> Abriendo tu cuenta'; el.disabled=true;
  await wait(1700);
  S.reg.abierta=true; S.reg.pausada=null; S.cuenta=S.elegida; S.saldo=0; S.movs=[];
  met(m=>m.listas++);
  go('exito');
};

ACT.cancelarReg=()=>sheet(`<h3>¿Cancelar el registro?</h3>
  <p class="lead" style="margin-top:8px;font-size:14.5px">Se borra tu avance y empiezas de cero.</p>
  <div class="stack" style="--g:9px;margin-top:18px">
    <button class="btn btn-s" data-a="cerrar">Mejor lo continúo</button>
    <button class="btn btn-g" data-a="cancelarOk">Sí, cancelar</button></div>`,true);
ACT.cancelarOk=()=>{ cerrar(); limpiar(); pinta() };

function confeti(){
  const d=$('#device'); if(!d) return;
  const cols=['#EC1C2D','#FFC94D','#12A150','#4D9BFF','#FF7AB0'];
  for(let i=0;i<34;i++){
    const c=document.createElement('i'); c.className='conf';
    c.style.cssText=`left:${Math.random()*100}%;background:${pick(cols)};animation-duration:${2+Math.random()*1.6}s;animation-delay:${Math.random()*.5}s`;
    d.appendChild(c); setTimeout(()=>c.remove(),4200);
  }
}

/* ============================================================
   9 · META (onboarding personalizado)
============================================================ */
V.meta=()=>`<div class="screen" style="background:#fff">
  ${topbar('')}
  <div class="pad grow">
    <span class="eyebrow">Un último paso</span>
    <h1 style="margin-top:10px">¿Para qué quieres tu dinero, ${DEMO.nombre}?</h1>
    <p class="lead" style="margin-top:10px">Con una meta te muestro tu avance.</p>
    <div class="opts" role="radiogroup" aria-label="Metas de ahorro" style="margin-top:22px">
      ${METAS.map(m=>`<button class="opt" role="radio" aria-checked="${S.meta&&S.meta.v===m.v}" data-a="setMeta" data-v="${m.v}">
        <span class="oi">${ic(m.i,19,S.meta&&S.meta.v===m.v?'var(--red)':'var(--ink-2)')}</span>
        <span class="ol">${m.l}<span class="od">Meta sugerida: ${mx0(m.monto)}</span></span>
        <span class="ock">${chkSvg()}</span></button>`).join('')}
    </div>
  </div>
  <div class="foot on-white">
    ${S.meta
      ? '<button class="btn btn-p" data-a="ir" data-v="fondeo">Continuar</button>'
      : '<button class="btn btn-p off" aria-disabled="true" data-a="falta" data-v=".opts|Elige una meta para continuar">Elige una meta para continuar</button>'}
    <button class="btn btn-g" data-a="saltarMeta" style="margin-top:6px">Ahora no</button>
  </div>
</div>`;
ACT.setMeta=v=>{ const m=METAS.find(x=>x.v===v); S.meta={...m,guardado:0}; guardar(); pinta() };
ACT.saltarMeta=()=>{ S.meta=null; guardar(); go('fondeo') };

/* ============================================================
   10 · FONDEO INICIAL
============================================================ */
const ORIGENES=[
  {v:'spei',l:'Transferencia desde otro banco',d:'SPEI · llega en minutos',i:'tx'},
  {v:'tarjeta',l:'Desde una tarjeta de débito',d:'Inmediato',i:'card'},
  {v:'corres',l:'Efectivo en corresponsalía',d:'Más de 13,000 puntos',i:'bank'}
];
const TOPE_DIG=22000;
V.fondeo=()=>{
  const f=S.fondeoTmp||(S.fondeoTmp={monto:1000,origen:'spei',otro:false});
  const excede=S.cuenta==='digital'&&f.monto>TOPE_DIG;
  const invalido=!f.monto||f.monto<=0||excede;
  if(!S.vioBeneficios){ S.vioBeneficios=true; guardar(); setTimeout(hojaBeneficios,420) }
  post(()=>{ const t=$('#cd'); if(t){ clearInterval(window._cd); window._cd=setInterval(()=>{ const e=$('#cd'); if(!e){clearInterval(window._cd);return} e.textContent=cuenta24() },1000) } });
  return `<div class="screen">
    ${topbar('Fondea tu cuenta','volverDeFondeo')}
    <div class="pad grow" style="padding-top:2px">
      <div class="prod" style="padding:16px">
        <div class="between" style="position:relative">
          <div><div class="pn" style="font-size:17px">Fondea en menos de 24 horas</div>
            <div class="pt">Y desbloqueas un beneficio inmediato</div></div>
          ${ic('gift',34,'#fff',1.6)}
        </div>
        <div class="row" style="gap:7px;margin-top:12px;position:relative">
          ${ic('clock',15,'#fff')}<span class="num" id="cd" style="font-weight:800;font-size:15px;letter-spacing:-.02em">23:59:59</span>
          <span style="font-size:12px;opacity:.85">para aprovecharlo</span>
        </div>
      </div>
      <button class="card-flat" data-a="verBeneficios" style="width:100%;text-align:left;margin-top:14px;display:flex;gap:11px;align-items:center">

function cuenta24(){
  const fin=(S.reg.finTs||(S.reg.finTs=Date.now()+864e5));
  let s=Math.max(0,Math.floor((fin-Date.now())/1000));
  const h=String(Math.floor(s/3600)).padStart(2,'0'); s%=3600;
  return `${h}:${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

const nivelMad=()=>{ const q=rc().q; return q>=12?3:q>=8?2:q>=4?1:0 };
/* progreso dentro del tramo actual: la madriguera se reinicia en cada hito */
function tramo(){
  const q=rc().q, prev=[0,...HITOS.map(h=>h.q)].filter(x=>x<=q).pop()||0;
  const sig=HITOS.find(h=>h.q>q);
  return {prev, meta:sig?sig.q:16, hecho:q-prev, total:(sig?sig.q:16)-prev, sig};
}
/* días que quedan de la quincena; sirve para el aviso de urgencia */
const diasQuincena=()=>{ const d=new Date().getDate(); return d<=15?15-d:(new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate())-d };
const urge=()=>S.fondeada&&rc().q>0&&diasQuincena()<=5&&!S.qCubierta;
const mesVariedad=()=>cb().activado&&(quincena()-cb().qAct)<2;
const maxElegidas=()=>hito(4)?2:1;
const TOPE=()=>hito(8)?450:300;
const cadaCuantas=()=>hito(12)?2:4;                 // quincenas entre cambios de categoría
const puedeCambiar=()=>!cb().elegidas.length||quincena()-cb().qCambio>=cadaCuantas();
const faltanCambio=()=>Math.max(0,cadaCuantas()-(quincena()-cb().qCambio));
const diasVariedad=()=>Math.max(0,(cb().qAct+2-quincena())*15);
const topeRestante=()=>Math.max(0,TOPE()-(cb().mesQ===Math.floor(quincena()/2)?cb().mesMonto:0));

const ALTA=4, ALTA_SUPER=3;
function tasa(v){
  const c=cb();
  if(mesVariedad()||c.elegidas.includes(v)) return v==='super'?ALTA_SUPER:ALTA;
  return 2;
}
/* Cashback de una compra, respetando el tope del mes */
function calcCB(monto,v){
  const c=cb(), mes=Math.floor(quincena()/2);
  if(c.mesQ!==mes){ c.mesQ=mes; c.mesMonto=0 }
  const bruto=monto*tasa(v)/100;
  const cabe=Math.max(0,TOPE()-c.mesMonto);
  const neto=Math.min(bruto,cabe);
  c.mesMonto+=neto; c.ganado+=neto;
  return neto;
}

/* ---------- tarjeta de cashback en el Inicio ---------- */
function tarjetaCashback(){
  const c=cb(), variedad=mesVariedad();
  const alta=variedad?CATS.filter(x=>x.v!=='super'):CATS.filter(x=>c.elegidas.includes(x.v));
  return `<div class="card" style="margin-top:14px">
    <div class="between" style="margin-bottom:4px">
      <h4>Mi cashback</h4>
      <button class="iconbtn" data-a="infoCB" aria-label="Cómo funciona el cashback"
        style="width:30px;height:30px">${ic('info',18,'var(--ink-3)')}</button>
    </div>
    <div class="row" style="gap:14px;margin-top:10px">
      <div style="flex:none;text-align:center">
        <div class="num" style="font-size:27px;font-weight:800;letter-spacing:-.045em;line-height:1;color:var(--red)">${mx(c.ganado)}</div>
        <div class="muted" style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:3px">Acumulado</div>
      </div>
      <div style="flex:1;border-left:1px solid var(--line-2);padding-left:14px">
        <div class="sm" style="font-weight:650">${variedad
          ? 'Todas tus categorías al <b>4%</b>'
          : (c.elegidas.length?`<b>${tasa(c.elegidas[0])}%</b> en ${CAT(c.elegidas[0]).l}${c.elegidas[1]?` y ${CAT(c.elegidas[1]).l}`:''}`
                              :'Elige tu categoría al <b>4%</b>')}</div>
        <div class="muted" style="margin-top:3px">${variedad
          ? `Solo en comercios selectos · ${diasVariedad()} días`
          : (c.elegidas.length?'Solo en comercios selectos. El resto, 2%':'El resto de la lista paga 2%')}</div>
      </div>
    </div>
    <div class="minibar" style="margin-top:13px"><i data-bar="${Math.round(100*(c.mesQ===Math.floor(quincena()/2)?c.mesMonto:0)/TOPE())}" style="width:0"></i></div>
    <div class="between" style="margin-top:7px">
      <span class="muted">Este mes ${mx0(c.mesQ===Math.floor(quincena()/2)?c.mesMonto:0)}</span>
      <span class="muted">Tope ${mx0(TOPE())}</span>
    </div>
    ${variedad?`<div class="note ok" style="margin-top:12px">${ic('zap',16)}
      <span><b>Mes de variedad.</b> Al terminar eliges ${maxElegidas()===2?'dos categorías':'una'} para conservar el 4%.</span></div>`:''}
    <button class="btn btn-s btn-sm" data-a="ir" data-v="cashback" style="width:100%;margin-top:12px">
      ${variedad?'Ver mis categorías':(c.elegidas.length?'Cambiar mis categorías':'Elegir mi categoría al 4%')}</button>
  </div>`;
}

/* ---------- tarjeta de racha en el Inicio ---------- */
function tarjetaRacha(){
  const r=rc(), t=tramo(), rota=r.gracia>quincena()&&!r.q;
  return `<button class="card" data-a="ir" data-v="racha" style="width:100%;text-align:left;margin-top:14px">
    <div class="between" style="margin-bottom:10px">
      <h4>Tu madriguera</h4>
      <span class="badge ${urge()?'b-warn':'b-red'}">${r.q} ${r.q===1?'quincena':'quincenas'}</span>
    </div>
    <div class="row" style="gap:14px">
      <img class="mad ${rota?'rota':''}" src="${MADS[nivelMad()]}" alt="Tu madriguera"
        style="width:92px;flex:none;margin:-6px 0 -10px">
      <div style="flex:1">
        ${madriguera()}
        <div class="muted" style="margin-top:8px">${t.sig
          ? `Faltan <b>${t.sig.q-r.q}</b> ${t.sig.q-r.q===1?'quincena':'quincenas'} para ${t.sig.t.toLowerCase()}`
          : 'Llegaste al último nivel. Banortingo está orgulloso.'}</div>
      </div>
    </div>
    ${urge()?`<div class="note warn" style="margin-top:11px">${ic('clock',16)}
      <span><b>Quedan ${diasQuincena()} días.</b> Si entra dinero, tu racha sigue.</span></div>`:''}
    ${r.pases?`<div class="note ok" style="margin-top:11px">${ic('shield',16)}
      <span><b>${r.pases} ${r.pases===1?'pase':'pases'}.</b> Si una quincena no llega, se usa solo.</span></div>`:''}
    ${r.gracia>quincena()?`<div class="note warn" style="margin-top:11px">${ic('clock',16)}
      <span><b>Mes de gracia.</b> Conservas tus beneficios.</span></div>`:''}
  </button>`;
}
/* barra de zacate: la madriguera que se llena */
function madriguera(){
  const t=tramo(), n=Math.min(12,Math.max(4,t.total)), llenos=Math.min(n,Math.round(n*t.hecho/t.total));
  return `<div class="row" style="gap:3px;align-items:flex-end;height:26px" aria-label="Avance de la racha">
    ${Array.from({length:n},(_,i)=>`<span style="flex:1;height:${8+(i%3)*5}px;border-radius:3px 3px 1px 1px;
      background:${i<llenos?'var(--red)':'var(--line)'};transition:background .3s"></span>`).join('')}
  </div>`;
}

            <span class="oi">${ic(x.i,19,activa?'var(--red)':'var(--ink-2)')}</span>
            <span class="ol">${x.l}<span class="od">${activa?`${t}% en comercios selectos · 2% en el resto`:'2% en toda la categoría'}</span></span>

            ${bloqueado?'':`<span class="ock" style="margin-left:9px">${chkSvg()}</span>`}
          </button>`}).join('')}
      </div>

      <div class="card" style="margin-top:16px">
        <div class="between"><h4>Promociones abiertas</h4>
          ${cb().activado?'<span class="badge b-ok">Activas</span>':'<span class="badge b-gray">Al fondear</span>'}</div>
        <div class="stack" style="--g:9px;margin-top:12px">
          ${PROMOS.map(p=>`<div class="row" style="gap:11px;${cb().activado?'':'opacity:.5'}">
            <span style="width:36px;height:36px;border-radius:11px;background:var(--red-50);display:grid;place-items:center;flex:none">${ic(p.i,18,'var(--red)')}</span>
            <div><div style="font-size:13.5px;font-weight:700">${p.t}</div><div class="muted">${p.d}</div></div></div>`).join('')}

        <div class="sh">${ic('play',11,'#7C8698')} Controles del prototipo</div>
        <div class="sr">
          <button class="s-ok" data-a="simQ">Avanzar una quincena</button>
          <button class="s-ok" data-a="simMes">Adelantar un mes</button>

          ${sel.length?'Guardar mi selección':'Elige al menos una categoría'}</button></div>`}
      <div style="height:12px"></div>
    </div></div>`;
};
ACT.pickCat=v=>{
  const sel=S.cbTmp, max=maxElegidas();
  if(sel.includes(v)) S.cbTmp=sel.filter(x=>x!==v);
  else if(sel.length<max) sel.push(v);
  else { S.cbTmp=[...sel.slice(1),v] }
  guardar(); pinta();
};
ACT.guardarCats=()=>{
  const c=cb(); c.elegidas=S.cbTmp.slice(); c.qCambio=quincena();
  guardar(); pinta();
  toast('Listo. '+c.elegidas.map(v=>CAT(v).l).join(' y ')+' al '+tasa(c.elegidas[0])+'%','check');
};

/* ---------- avance de tiempo simulado ---------- */
function avanzaQuincena(conDeposito){
  const r=rc(), c=cb();
  S.simQ=quincena()+1;
  const mes=Math.floor(quincena()/2);
  if(c.mesQ!==mes){ c.mesQ=mes; c.mesMonto=0 }
  if(conDeposito){
    r.q++; r.mejor=Math.max(r.mejor,r.q); r.hist.push(1);
    if(r.q%3===0) r.pases++;
    const h=HITOS.find(x=>x.q===r.q);

/* ---------- BUSCADOR DE COMERCIOS ADHERIDOS ---------- */
V.comercios=()=>{
  const q=(S.busca||'').toLowerCase().trim();
  const lista=COMERCIOS.filter(x=>!q||x.n.toLowerCase().includes(q)||CAT(x.c).l.toLowerCase().includes(q)||x.z.toLowerCase().includes(q));
  const porCat={}; lista.forEach(x=>{ (porCat[x.c]=porCat[x.c]||[]).push(x) });
  return `<div class="screen">
    ${topbar('Comercios participantes','volverCashback')}
    <div class="pad" style="padding-top:2px">
      <p class="muted">La tasa alta es solo aquí. En el resto, 2%.</p>
      <label class="field" style="margin-top:14px">
        <input id="busca" value="${esc(S.busca||'')}" placeholder="Busca por comercio, categoría o zona" aria-label="Buscar comercios">
      </label>
      ${Object.keys(porCat).length?Object.entries(porCat).map(([c,arr])=>{
        const t=tasa(c), alta=t>2;
        return `<div class="card" style="margin-top:14px">
          <div class="between" style="margin-bottom:10px">
            <div class="row" style="gap:9px">${ic(CAT(c).i,18,alta?'var(--red)':'var(--ink-3)')}
              <h4>${CAT(c).l}</h4></div>
            <span class="badge ${alta?'b-red':'b-gray'}">${t}%</span>
          </div>
          <div class="list">
            ${arr.map(x=>`<div class="li"><span class="lav">${ic('pin',17,'var(--ink-3)')}</span>
              <div style="flex:1"><div class="lt">${x.n}</div><div class="ld">${x.z}</div></div>
              <span class="badge ${alta?'b-ok':'b-gray'}" style="flex:none">${t}%</span></div>`).join('')}
          </div>
          ${alta?'':`<p class="muted" style="margin-top:9px">Elígela para que te paguen la tasa alta.</p>`}
        </div>`}).join('')
      :`<div class="card" style="margin-top:16px;text-align:center">
          <p class="sm" style="font-weight:650">Sin resultados</p>
          <p class="muted" style="margin-top:4px">Prueba con otra palabra o zona.</p></div>`}
      <p class="muted" style="margin:16px 0 8px;text-align:center">Lista de demostración.</p>
      <div style="height:12px"></div>
    </div></div>`;
};
ACT.volverCashback=()=>{ S.busca=''; go('cashback') };

function lineChart(){
  const W=300,H=118,ah=[1200,2100,3400,4600,5300,6250],gs=[2100,4300,6100,8400,10600,12750];
  const max=Math.max(...gs)*1.12;
  const pt=(a,i)=>[18+i*((W-28)/(a.length-1)),H-14-(a[i]/max)*(H-30)];
  const path=a=>a.map((_,i)=>{const[x,y]=pt(a,i);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ');
  const area=a=>path(a)+` L${(18+(a.length-1)*((W-28)/(a.length-1))).toFixed(1)} ${H-14} L18 ${H-14} Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Ahorro y gastos de los últimos 6 meses">

    <path class="ar" d="${area(gs)}" fill="var(--red)"/>
    <path class="ln" d="${path(gs)}" stroke="var(--red)"/>
    <path class="ln" d="${path(ah)}" stroke="var(--ok)"/>

}

function proyChart(){

    <path class="ln" d="${p(real,0)}" stroke="var(--ok)"/>
    <path class="ln" d="${p(proy,real.length-1)}" stroke="var(--ink-3)" stroke-dasharray="4 4"/>
    <circle cx="${X(real.length-1).toFixed(1)}" cy="${Y(real.at(-1)).toFixed(1)}" r="3.4" fill="var(--ok)"/>

}

    <div style="height:12px"></div>
  </div></div>`;

ACT.verDatos=()=>{ S.verDatos=!S.verDatos; guardar(); pinta() };
ACT.congelar=()=>{
  S.congelada=!S.congelada; if(S.congelada) S.verDatos=false;
  guardar(); pinta();
  toast(S.congelada?'Tarjeta congelada. Pagos bloqueados.':'Tarjeta activa otra vez.', S.congelada?'lock':'check');
};
ACT.copiarClabe=()=>{
  const t=TARJETA.clabePlano;
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(()=>{});
  toast('CLABE copiada','file');
};
ACT.pedirFisica=()=>sheet(`<div style="text-align:center;padding:4px 0 0">
  <div style="width:52px;height:52px;border-radius:16px;background:var(--ok-50);display:grid;place-items:center;margin:0 auto 14px">${ic('check',26,'var(--ok)')}</div>
  <h3>Tarjeta solicitada</h3>
  <p class="lead" style="margin-top:9px;font-size:14.5px">Llegaría a ${DEMO.calle} ${DEMO.num}, ${DEMO.col} en 5 a 7 días hábiles.</p></div>
  <button class="btn btn-p" data-a="cerrar" style="margin-top:18px">Entendido</button>`,true);

/* ---------- NOTIFICACIONES (retención omnicanal) ---------- */
V.notifs=()=>{
  const N=[
    {i:'gift',t:'Tu cashback subió a 4%',d:'Por fondear a tiempo tienes un mes con toda la lista a la tasa alta.',c:'App',n:1},
    {i:'target',t:'Vas por buen camino',d:'Llevas '+(S.meta?Math.round(100*S.meta.guardado/S.meta.monto):25)+'% de tu meta. Aparta hoy y adelanta un mes.',c:'Push',n:1},
    {i:'rec',t:'Domicilia tu recibo de luz',d:'Vimos que pagas CFE cada mes. Podemos hacerlo solo.',c:'Correo'},
    {i:'up',t:'Tu línea de crédito puede subir',d:'Usar tu cuenta con regularidad mejora tu perfil.',c:'App'},
    {i:'star',t:'Promociones cerca de ti',d:'12 comercios participantes en Roma Norte.',c:'SMS'}
  ];
  return `<div class="screen">
    ${topbar('Notificaciones y ofertas','irApp')}
    <div class="pad" style="padding-top:2px">
      <p class="muted">Según cómo usas tu cuenta. Nunca más de una al día.</p>
      <div class="stack" style="--g:10px;margin-top:16px">
        ${N.map(x=>`<button class="card" data-a="oferta" data-v="${x.t}" style="width:100%;text-align:left;padding:15px;display:flex;gap:12px;
          ${x.n?'border:1.5px solid var(--red-100);background:var(--red-50)':''}">
          <span style="width:40px;height:40px;border-radius:12px;background:${x.n?'#fff':'var(--line-2)'};display:grid;place-items:center;flex:none">${ic(x.i,19,'var(--red)')}</span>
          <span style="flex:1"><span class="between"><b style="font-size:14px;letter-spacing:-.02em">${x.t}</b>
            <span class="badge b-gray" style="flex:none">${x.c}</span></span>
            <span class="muted" style="display:block;margin-top:3px">${x.d}</span></span></button>`).join('')}
      </div>
      <div class="note info" style="margin-top:16px">${ic('info',16)}<span>Cada tarjeta muestra por qué canal llegaría.</span></div>
      <div style="height:12px"></div>
    </div></div>`;
};

/* ============================================================
   12 · MÉTRICAS REALES DEL PROTOTIPO
============================================================ */
V.metricas=()=>{
  const t=M.tiempos.length?Math.round(M.tiempos.reduce((a,b)=>a+b,0)/M.tiempos.length):0;
  const comp=M.quizInic?Math.round(100*M.quizComp/M.quizInic):0;
  const list=M.quizInic?Math.round(100*M.listas/M.quizInic):0;
  const ab=Object.entries(M.abandono).sort((a,b)=>b[1]-a[1])[0];
  const at=Object.entries(M.atras).sort((a,b)=>b[1]-a[1])[0];
  const rc=Object.entries(M.recom).sort((a,b)=>b[1]-a[1]);
  const meta67=comp>=67;
  return `<div class="screen">
    ${topbar('Prototype / Testing','irApp')}
    <div class="pad" style="padding-top:2px">
      <div class="note info">${ic('info',16)}<span><b>No están simulados:</b> se miden en este navegador. Úsalos en tus entrevistas.</span></div>
      <div class="mtr" style="margin-top:16px">
        <div class="m"><div class="mv num">${M.quizInic}</div><div class="mk">Cuestionarios iniciados</div></div>
        <div class="m"><div class="mv num">${M.quizComp}</div><div class="mk">Cuestionarios completados</div></div>
        <div class="m"><div class="mv num">${comp}%</div><div class="mk">Tasa de finalización</div></div>
        <div class="m"><div class="mv num">${t?Math.floor(t/60)+':'+String(t%60).padStart(2,'0'):'—'}</div><div class="mk">Tiempo promedio (min)</div></div>
        <div class="m"><div class="mv num">${M.listas}</div><div class="mk">Cuentas abiertas</div></div>
        <div class="m"><div class="mv num">${M.fondeos}</div><div class="mk">Fondeos completados</div></div>
      </div>

      <div class="card" style="margin-top:14px">
        <h4>Criterio de tu Test Card</h4>
        <p class="muted" style="margin-top:5px">Esperabas que 20 de 30 personas (67%) terminaran cómodas.</p>
        <div class="minibar" style="margin-top:12px"><i style="width:${Math.min(100,comp)}%;background:${meta67?'var(--ok)':'var(--red)'}"></i></div>
        <div class="between" style="margin-top:8px">
          <span class="badge ${meta67?'b-ok':'b-warn'}">${comp}% actual</span>
          <span class="muted">Meta: 67%</span></div>
      </div>

      <div class="card" style="margin-top:14px">
        <h4>Dónde se traba la gente</h4>
        <div style="margin-top:10px">
          <div class="kv"><span>Pregunta con más abandonos</span><b>${ab?Q[ab[0]]?.t.slice(0,26)+'…':'—'}</b></div>
          <div class="kv"><span>Pregunta con más retrocesos</span><b>${at?Q[at[0]]?.t.slice(0,26)+'…':'—'}</b></div>
          <div class="kv"><span>Códigos SMS fallidos</span><b class="num">${M.otpNo||0}</b></div>
          <div class="kv"><span>INE rechazadas</span><b class="num">${M.ineNo}</b></div>
          <div class="kv"><span>Pruebas de vida fallidas</span><b class="num">${M.liveNo}</b></div>
          <div class="kv"><span>Usaron verificación por voz</span><b class="num">${M.vozOk||0}</b></div>
          <div class="kv"><span>Audios rechazados</span><b class="num">${M.vozNo||0}</b></div>
          <div class="kv"><span>Entraron por "ya sé qué cuenta quiero"</span><b class="num">${M.rapida||0}</b></div>
          <div class="kv"><span>De esos, volvieron al cuestionario</span><b class="num">${M.rapidaVuelta||0}</b></div>
          <div class="kv"><span>Vieron "otras opciones"</span><b class="num">${M.verOtras}</b></div>
          <div class="kv"><span>Cambiaron la recomendación</span><b class="num">${M.cambio}</b></div>
        </div>
      </div>

      <div class="card" style="margin-top:14px">
        <h4>Cuenta más recomendada</h4>
        <div class="stack" style="--g:9px;margin-top:12px">
          ${rc.length?rc.map(([id,n])=>`<div><div class="between" style="margin-bottom:5px">
            <span class="sm" style="font-weight:650">${CUENTAS[id].corto}</span><span class="num sm">${n}</span></div>
            <div class="minibar"><i style="width:${Math.round(100*n/rc[0][1])}%"></i></div></div>`).join('')
            :'<p class="muted">Todavía no hay recomendaciones registradas.</p>'}
        </div>
      </div>

      <div class="btn-row" style="margin-top:16px">
        <button class="btn btn-s" data-a="bajarMet">${ic('dl',17)} Descargar</button>
        <button class="btn btn-s" data-a="resetMet">${ic('trash',17)} Reiniciar</button>
      </div>
      <p class="muted" style="text-align:center;margin-top:12px">Los datos viven solo en este navegador.</p>
      <div style="height:12px"></div>
    </div></div>`;
};
ACT.bajarMet=()=>{
  const data={generado:new Date().toISOString(),prototipo:'Banorte Cuenta Ideal',metricas:M};
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='banorte-metricas-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href); toast('Archivo descargado','dl');
};
ACT.resetMet=()=>{ M=NUEVAS_MET(); guardarMet(); pinta(); toast('Métricas reiniciadas','refresh') };

ACT.aceptarAviso=()=>{ S.aviso=true; guardar(); cerrar() };

(function boot(){
  cargarMet();
  const g=cargar();
  if(g){
    S=Object.assign(NUEVO(),g);
    met(m=>{
      m.sesiones++;
      // si dejó un cuestionario a medias, cuenta el abandono en la pregunta donde se quedó
      if(g.quiz&&g.quiz.t0&&!g.rec&&g.quiz.visto) inc(m.abandono,g.quiz.visto);
    });
    if(S.reg&&S.reg.pausada&&!S.reg.abierta){ S.reg.volviendo=true; S.pant='pausa' }
    else if(['analizando'].includes(S.pant)) S.pant='resultado';
  } else {
    met(m=>m.sesiones++);
  }
  if(S.pant==='app'&&!S.cuenta) S.pant='gate';
  pinta();
  if(!S.aviso) setTimeout(disclaimer,320);
  const alSalir=()=>{
    camOff();
    if(S.pant==='registro'&&!S.reg.abierta&&!S.reg.pausada) S.reg.pausada=Date.now();
    guardar();
  };
  window.addEventListener('beforeunload',alSalir);
  window.addEventListener('pagehide',alSalir);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') alSalir() });
  document.addEventListener('input',e=>{
    if(e.target.id==='busca'){
      S.busca=e.target.value;
      clearTimeout(window._bq); window._bq=setTimeout(()=>{
        if($('#busca')!==e.target) return;
        const p=e.target.selectionStart; pinta();
        const n=$('#busca'); if(n){ n.focus(); try{n.setSelectionRange(p,p)}catch(_){} }
      },260);
      return;
    }
    if(e.target.id==='montoLibre'){
      const v=e.target.value.replace(/[^\d.]/g,'');
      if(v!==e.target.value) e.target.value=v;
      S.fondeoTmp.monto=parseFloat(v)||0;
      const b=$('[data-a="fondear"]'), ex=S.cuenta==='digital'&&S.fondeoTmp.monto>TOPE_DIG;
      if(b){ b.disabled=!S.fondeoTmp.monto||ex; b.textContent=!S.fondeoTmp.monto?'Escribe un monto':'Fondear '+mx0(S.fondeoTmp.monto) }
      clearTimeout(window._mt); window._mt=setTimeout(()=>{ if($('#montoLibre')===e.target){ guardar(); const p=e.target.selectionStart; pinta();
        const n=$('#montoLibre'); if(n){ n.focus(); try{n.setSelectionRange(p,p)}catch(_){} } } },700);
      return;
    }
    if(e.target.id==='apLibre'){
      const v=e.target.value.replace(/[^\d.]/g,'');
      if(v!==e.target.value) e.target.value=v;
      S.apTmp.monto=parseFloat(v)||0;
      const b=$('[data-a="apartarOk"]');
      if(b){ b.disabled=!S.apTmp.monto||S.apTmp.monto>S.saldo;
        b.textContent=!S.apTmp.monto?'Escribe un monto':'Apartar '+mx0(S.apTmp.monto) }
      return;
    }
    if(e.target.closest('#otp')){
      const i=e.target, all=[...$$('#otp input')];
      i.value=i.value.replace(/\D/g,'').slice(0,1);
      i.style.borderColor=i.value?'var(--red)':'var(--line)';
      const k=all.indexOf(i);
      if(i.value&&k<3) all[k+1].focus();
      $('#otpBtn').disabled=all.some(x=>!x.value);
    }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Backspace'&&e.target.closest('#otp')&&!e.target.value){
      const all=[...$$('#otp input')], k=all.indexOf(e.target);
      if(k>0){ all[k-1].focus(); all[k-1].value='' }
    }
  });
})();

setInterval(()=>{const c=document.getElementById('clk');if(c)c.textContent=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})},1000);
</script>
